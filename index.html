<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4a7b9"><meta name="description" content="Insert Coin · control de despeses familiars"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Insert Coin</title><style>
:root{--p:#f4a7b9;--p2:#ffdce5;--bg:#fff8fa;--ink:#292727;--muted:#777;--card:#fff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff,var(--bg));font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:720px;margin:auto;padding:15px 14px 92px}header{display:flex;align-items:center;gap:12px;padding:5px 2px 15px}.logo{width:58px;height:58px;border-radius:18px;box-shadow:0 8px 24px #0001}h1{font-size:25px;margin:0;font-weight:850}header small{color:var(--muted)}.install{display:none;width:100%;padding:13px;margin:0 0 12px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800}.install.show{display:block}.summary{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}.card{background:var(--card);border-radius:21px;padding:15px;box-shadow:0 7px 22px #0000000e}.total{background:linear-gradient(135deg,#f6b0c0,var(--p2))}.label{font-size:13px;color:#6c5d62}.amount{font-size:30px;font-weight:900}.sub{font-size:20px;font-weight:850;margin-top:4px}.title{display:flex;justify-content:space-between;align-items:center;font-weight:850;margin:18px 2px 10px}.link{background:none;color:#9a5267;font-weight:750}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cat{background:#fff;border-radius:19px;min-height:108px;padding:12px 5px;box-shadow:0 5px 17px #0000000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.cat:active{transform:scale(.97)}.emoji{font-size:35px}.cat b{font-size:14px;text-align:center}.screen{display:none}.screen.active{display:block}.list{display:flex;flex-direction:column;gap:8px}.entry{background:#fff;border-radius:16px;padding:11px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px #0001}.ei{font-size:27px}.em{flex:1}.en{font-weight:800}.ed{font-size:12px;color:var(--muted)}.ea{font-weight:850}.actions{display:flex;gap:3px}.mini{width:33px;height:33px;border-radius:9px;background:#f5eef0}.empty{text-align:center;background:#fff;border-radius:17px;padding:25px;color:var(--muted)}nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #eee;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}nav button{background:none;color:#777;font-size:12px;font-weight:750}nav .ni{display:block;font-size:22px}nav .active{color:#a84e68}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(720px,100%);background:#fff;border-radius:27px 27px 0 0;padding:17px 15px calc(18px + env(safe-area-inset-bottom))}.mh{display:flex;align-items:center;gap:10px}.close{margin-left:auto;width:36px;height:36px;border-radius:50%;background:#f2edef}.chosen{font-size:19px;font-weight:850}.big{width:100%;border:0;border-bottom:3px solid var(--p);background:transparent;text-align:center;font-size:42px;font-weight:900;outline:0;margin:18px 0 12px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{height:53px;border-radius:15px;background:#f6f0f2;font-size:21px;font-weight:800}.save{width:100%;height:52px;margin-top:9px;border-radius:15px;background:var(--p);color:#fff;font-weight:900}.note{width:100%;border:1px solid #eee;border-radius:12px;padding:10px;margin-bottom:1px}.monthbar{display:flex;justify-content:space-between;align-items:center}.monthbar button{width:38px;height:38px;border-radius:11px;background:#f5eef0}.monthname{text-transform:capitalize;font-weight:850}.bar{height:10px;background:#f0e5e8;border-radius:10px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--p)}.statrow{display:flex;align-items:center;gap:9px;margin:11px 0}.statrow b{min-width:76px;text-align:right;font-size:13px}@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}.app{padding-left:20px;padding-right:20px}}
</style></head><body><div class="app"><header><img class="logo" src="icon.svg" alt="Insert Coin"><div><h1>Insert Coin</h1><small>Control de despeses familiars</small></div></header><button id="install" class="install">📲 Instal·lar Insert Coin</button>
<section id="home" class="screen active"><div class="summary"><div class="card total"><div class="label">Aquest mes</div><div id="monthTotal" class="amount">0,00 €</div></div><div class="card"><div class="label">Avui</div><div id="todayTotal" class="sub">0,00 €</div><div id="todayCount" class="label">0 despeses</div></div></div><div class="title"><span>En què has gastat?</span><button class="link" onclick="go('history')">Veure tot</button></div><div id="cats" class="grid"></div></section>
<section id="history" class="screen"><div class="title"><span>Historial</span><button class="link" onclick="clearAll()">Esborrar tot</button></div><div id="list" class="list"></div></section>
<section id="stats" class="screen"><div class="title"><span>Resum</span></div><div class="card"><div class="monthbar"><button onclick="moveMonth(-1)">‹</button><span id="monthName" class="monthname"></span><button onclick="moveMonth(1)">›</button></div><div id="statTotal" class="amount" style="text-align:center;margin-top:18px">0,00 €</div><div class="label" style="text-align:center">Total</div></div><div class="card" style="margin-top:10px"><b>Per categoria</b><div id="statsCats"></div></div></section></div>
<nav><button data-s="home" class="active"><span class="ni">➕</span>Afegir</button><button data-s="history"><span class="ni">📋</span>Historial</button><button data-s="stats"><span class="ni">📊</span>Resum</button></nav>
<div id="modal" class="modal"><div class="sheet"><div class="mh"><span id="me" class="emoji">☕</span><div><div id="mc" class="chosen">Cafè</div><div class="label">Quant has gastat?</div></div><button class="close" onclick="closeModal()">✕</button></div><input id="amt" class="big" placeholder="0,00 €" readonly><div class="keys"><button class="key" onclick="k('1')">1</button><button class="key" onclick="k('2')">2</button><button class="key" onclick="k('3')">3</button><button class="key" onclick="k('4')">4</button><button class="key" onclick="k('5')">5</button><button class="key" onclick="k('6')">6</button><button class="key" onclick="k('7')">7</button><button class="key" onclick="k('8')">8</button><button class="key" onclick="k('9')">9</button><button class="key" onclick="k(',')">,</button><button class="key" onclick="k('0')">0</button><button class="key" onclick="del()">⌫</button></div><input id="note" class="note" placeholder="Nota (opcional)"><button id="saveBtn" class="save" onclick="saveExpense()">GUARDAR DESPESA</button></div></div>
<script>
const C=[['cafe','Cafè','☕'],['super','Supermercat','🛒'],['menjar','Menjar / Restaurant','🍽️'],['gas','Gasolina','⛽'],['casa','Casa','🏠'],['roba','Roba','👕'],['salut','Salut','💊'],['nens','Escola / Nens','🎒'],['vehicle','Cotxe / Moto','🏍️'],['telefon','Telèfon','📱'],['oci','Oci','🎭'],['altres','Altres','💶']];let data=JSON.parse(localStorage.getItem('insertCoinExpenses')||'[]'),sel=null,editId=null,view=new Date(),deferred=null;const money=n=>new Intl.NumberFormat('ca-ES',{style:'currency',currency:'EUR'}).format(n);const cat=id=>C.find(x=>x[0]===id)||C[11];function persist(){localStorage.setItem('insertCoinExpenses',JSON.stringify(data))}function drawCats(){cats.innerHTML=C.map(x=>`<button class="cat" onclick="openModal('${x[0]}')"><span class="emoji">${x[2]}</span><b>${x[1]}</b></button>`).join('')}function openModal(id,idEdit=null){sel=cat(id);editId=idEdit;me.textContent=sel[2];mc.textContent=sel[1];amt.value='';note.value='';if(idEdit){let e=data.find(x=>x.id===idEdit);amt.value=String(e.amount).replace('.',',');note.value=e.note||''}modal.classList.add('show')}function closeModal(){modal.classList.remove('show');editId=null}function k(x){if(x===','&&amt.value.includes(','))return;if(amt.value.length<9)amt.value+=x}function del(){amt.value=amt.value.slice(0,-1)}function saveExpense(){let v=parseFloat(amt.value.replace(',','.'));if(!v||v<=0){alert('Introdueix un import vàlid');return}if(editId){let e=data.find(x=>x.id===editId);Object.assign(e,{amount:Math.round(v*100)/100,category:sel[0],note:note.value.trim()})}else data.push({id:Date.now(),category:sel[0],amount:Math.round(v*100)/100,note:note.value.trim(),date:new Date().toISOString()});persist();closeModal();refresh()}function refresh(){let now=new Date(),ym=now.toISOString().slice(0,7),day=now.toISOString().slice(0,10),m=data.filter(e=>e.date.slice(0,7)===ym),d=m.filter(e=>e.date.slice(0,10)===day);monthTotal.textContent=money(m.reduce((a,e)=>a+e.amount,0));todayTotal.textContent=money(d.reduce((a,e)=>a+e.amount,0));todayCount.textContent=`${d.length} ${d.length===1?'despesa':'despeses'}`;drawList();drawStats()}function drawList(){let a=[...data].sort((x,y)=>y.date.localeCompare(x.date));list.innerHTML=a.length?a.map(e=>{let c=cat(e.category),dt=new Date(e.date);return `<div class="entry"><span class="ei">${c[2]}</span><div class="em"><div class="en">${c[1]}</div><div class="ed">${dt.toLocaleDateString('ca-ES')} · ${dt.toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'})}${e.note?' · '+esc(e.note):''}</div></div><b class="ea">${money(e.amount)}</b><div class="actions"><button class="mini" onclick="edit(${e.id})">✏️</button><button class="mini" onclick="removeE(${e.id})">🗑️</button></div></div>`}).join(''):'<div class="empty">Encara no hi ha despeses.<br>Prem una icona per començar.</div>'}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function edit(id){let e=data.find(x=>x.id===id);openModal(e.category,id)}function removeE(id){if(confirm('Eliminar aquesta despesa?')){data=data.filter(e=>e.id!==id);persist();refresh()}}function clearAll(){if(data.length&&confirm('Vols eliminar totes les despeses d’aquest dispositiu?')){data=[];persist();refresh()}}function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.s===id));if(id==='stats')drawStats()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.s));function drawStats(){let key=view.toISOString().slice(0,7),m=data.filter(e=>e.date.slice(0,7)===key),tot=m.reduce((a,e)=>a+e.amount,0);monthName.textContent=view.toLocaleDateString('ca-ES',{month:'long',year:'numeric'});statTotal.textContent=money(tot);let s=C.map(c=>({...c,total:m.filter(e=>e.category===c[0]).reduce((a,e)=>a+e.amount,0)})).filter(x=>x.total).sort((a,b)=>b.total-a.total),max=s[0]?.total||1;statsCats.innerHTML=s.length?s.map(x=>`<div class="statrow"><span>${x[2]}</span><div class="bar"><i style="width:${x.total/max*100}%"></i></div><b>${money(x.total)}</b></div>`).join(''):'<div class="empty" style="margin-top:10px">Cap despesa aquest mes.</div>'}function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);drawStats()}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.classList.add('show')});install.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;install.classList.remove('show')}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));drawCats();refresh();
</script></body></html>
