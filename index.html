<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4a7b9">
  <meta name="description" content="Insert Coin · Control senzill de despeses familiars">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <title>Insert Coin</title>
  <style>
    :root{--pink:#f4a7b9;--pink2:#ffdce5;--dark:#292727;--muted:#777;--bg:#fff8fa;--card:#fff;--green:#55a66a;--red:#d9534f;--shadow:0 8px 24px #00000012}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#fff 0,#fff8fa 100%);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--dark);min-height:100vh}
    button,input{font:inherit} button{border:0;cursor:pointer} .app{max-width:720px;margin:auto;padding:16px 14px 92px}
    header{display:flex;align-items:center;gap:12px;padding:8px 2px 14px}.logo{width:58px;height:58px;border-radius:18px;object-fit:cover;box-shadow:var(--shadow)} h1{font-size:25px;margin:0;font-weight:800} header small{color:var(--muted)}
    .summary{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-bottom:14px}.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.total{background:linear-gradient(135deg,#f7b3c3,#ffdce5)}.label{font-size:13px;color:#6c5d62}.amount{font-size:30px;font-weight:850;margin-top:3px}.subamount{font-size:20px;font-weight:750;margin-top:3px}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px;font-weight:800}.linkbtn{background:none;color:#9a5267;font-weight:700;padding:4px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cat{background:#fff;border-radius:20px;padding:14px 7px;min-height:112px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;transition:.15s}.cat:active{transform:scale(.97)}.emoji{font-size:36px}.cat span:last-child{font-weight:750;font-size:14px;text-align:center}
    .history{display:flex;flex-direction:column;gap:8px}.entry{display:flex;align-items:center;gap:11px;background:#fff;border-radius:17px;padding:11px 12px;box-shadow:0 3px 14px #00000009}.entry-icon{font-size:27px}.entry-main{flex:1;min-width:0}.entry-name{font-weight:750}.entry-date{font-size:12px;color:var(--muted)}.entry-amount{font-weight:850}.entry-actions{display:flex;gap:3px}.mini{background:#f7f0f2;border-radius:10px;width:34px;height:34px}.empty{padding:24px;text-align:center;color:var(--muted);background:#fff;border-radius:18px}
    nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);background:#fffdfd;border-top:1px solid #eee;display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{background:none;color:#777;font-size:12px;font-weight:750;padding:5px}nav .nav-icon{display:block;font-size:23px;margin-bottom:1px}nav button.active{color:#a84e68}
    .modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{background:#fff;width:min(720px,100%);border-radius:28px 28px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}.sheet-head{display:flex;align-items:center;gap:10px}.sheet-head .emoji{font-size:32px}.close{margin-left:auto;background:#f3eef0;border-radius:50%;width:36px;height:36px}.chosen{font-weight:850;font-size:19px}.big-input{width:100%;border:0;border-bottom:3px solid var(--pink);font-size:42px;font-weight:850;text-align:center;outline:none;margin:20px 0 14px;background:transparent}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{background:#f7f1f3;border-radius:16px;height:55px;font-size:22px;font-weight:750}.key.ok{background:var(--pink);color:#fff}.key.del{background:#eee}.save-note{width:100%;margin-top:10px;border:1px solid #eee;border-radius:13px;padding:11px 12px;outline:none}.install{display:none;margin:2px 0 14px;width:100%;background:#292727;color:#fff;border-radius:16px;padding:13px;font-weight:800}.install.show{display:block}
    .screen{display:none}.screen.active{display:block}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.monthbar button{background:#f7f0f2;border-radius:12px;width:38px;height:38px}.monthname{text-transform:capitalize;font-weight:850}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.catrow{display:flex;align-items:center;gap:10px;margin:10px 0}.bar{height:10px;background:#f2e7ea;border-radius:20px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--pink);border-radius:20px}.catrow b{min-width:78px;text-align:right;font-size:13px}
    @media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}.app{padding-left:20px;padding-right:20px}}
  </style>
</head>
<body>
<div class="app">
  <header><img class="logo" src="icon-192.png" alt="Insert Coin"><div><h1>Insert Coin</h1><small>Control de despeses familiars</small></div></header>
  <button id="installBtn" class="install">📲 Instal·lar Insert Coin</button>

  <main id="home" class="screen active">
    <div class="summary"><div class="card total"><div class="label">Aquest mes</div><div id="monthTotal" class="amount">0,00 €</div></div><div class="card"><div class="label">Avui</div><div id="todayTotal" class="subamount">0,00 €</div><div id="countToday" class="label">0 despeses</div></div></div>
    <div class="section-title"><span>En què has gastat?</span><button class="linkbtn" onclick="showScreen('history')">Veure tot</button></div>
    <div id="categories" class="grid"></div>
  </main>

  <main id="history" class="screen"><div class="section-title"><span>Historial</span><button class="linkbtn" onclick="clearAll()">Esborrar tot</button></div><div id="historyList" class="history"></div></main>

  <main id="stats" class="screen"><div class="section-title"><span>Resum</span></div><div class="card"><div class="monthbar"><button onclick="changeMonth(-1)">‹</button><div id="monthLabel" class="monthname"></div><button onclick="changeMonth(1)">›</button></div><div id="statsTotal" class="amount" style="text-align:center;margin:18px 0 4px">0,00 €</div><div class="label" style="text-align:center">Total de despeses</div></div><div class="card" style="margin-top:10px"><div style="font-weight:800;margin-bottom:8px">Per categoria</div><div id="categoryStats"></div></div></main>
</div>

<nav><button class="active" data-screen="home"><span class="nav-icon">➕</span>Afegir</button><button data-screen="history"><span class="nav-icon">📋</span>Historial</button><button data-screen="stats"><span class="nav-icon">📊</span>Resum</button></nav>

<div id="modal" class="modal"><div class="sheet"><div class="sheet-head"><div id="modalEmoji" class="emoji">☕</div><div><div id="modalCat" class="chosen">Cafè</div><div class="label">Quant has gastat?</div></div><button class="close" onclick="closeModal()">✕</button></div><input id="amount" class="big-input" inputmode="decimal" placeholder="0,00 €" readonly><div class="keypad"><button class="key" onclick="key('1')">1</button><button class="key" onclick="key('2')">2</button><button class="key" onclick="key('3')">3</button><button class="key" onclick="key('4')">4</button><button class="key" onclick="key('5')">5</button><button class="key" onclick="key('6')">6</button><button class="key" onclick="key('7')">7</button><button class="key" onclick="key('8')">8</button><button class="key" onclick="key('9')">9</button><button class="key" onclick="key(',')">,</button><button class="key" onclick="key('0')">0</button><button class="key del" onclick="backspace()">⌫</button></div><input id="note" class="save-note" placeholder="Nota (opcional)"><button class="key ok" style="width:100%;margin-top:10px" onclick="saveExpense()">GUARDAR DESPESA</button></div></div>
<script>
const CATS=[
 {id:'cafe',name:'Cafè',emoji:'☕'},{id:'super',name:'Supermercat',emoji:'🛒'},{id:'menjar',name:'Menjar / Restaurant',emoji:'🍽️'},
 {id:'gas',name:'Gasolina',emoji:'⛽'},{id:'casa',name:'Casa',emoji:'🏠'},{id:'roba',name:'Roba',emoji:'👕'},
 {id:'salut',name:'Salut',emoji:'💊'},{id:'nens',name:'Escola / Nens',emoji:'🎒'},{id:'vehicle',name:'Cotxe / Moto',emoji:'🏍️'},
 {id:'telefon',name:'Telèfon',emoji:'📱'},{id:'oci',name:'Oci',emoji:'🎭'},{id:'altres',name:'Altres',emoji:'💶'}
];
let expenses=JSON.parse(localStorage.getItem('insertCoinExpenses')||'[]');let selected=null;let viewDate=new Date();let deferredPrompt=null;
const eur=n=>new Intl.NumberFormat('ca-ES',{style:'currency',currency:'EUR'}).format(n);
const save=()=>localStorage.setItem('insertCoinExpenses',JSON.stringify(expenses));
function renderCats(){document.getElementById('categories').innerHTML=CATS.map(c=>`<button class="cat" onclick="openModal('${c.id}')"><span class="emoji">${c.emoji}</span><span>${c.name}</span></button>`).join('')}
function openModal(id){selected=CATS.find(c=>c.id===id);modalEmoji.textContent=selected.emoji;modalCat.textContent=selected.name;amount.value='';note.value='';modal.classList.add('show');setTimeout(()=>amount.focus(),100)}
function closeModal(){modal.classList.remove('show')}
function key(v){if(v===','&&amount.value.includes(','))return;if(amount.value.length>8)return;amount.value+=v}
function backspace(){amount.value=amount.value.slice(0,-1)}
function saveExpense(){let raw=amount.value.replace(',','.');let value=parseFloat(raw);if(!selected||!value||value<=0){alert('Introdueix un import vàlid');return}expenses.push({id:Date.now(),category:selected.id,amount:Math.round(value*100)/100,note:note.value.trim(),date:new Date().toISOString()});save();closeModal();refresh()}
function refresh(){let now=new Date(), ym=now.toISOString().slice(0,7), today=now.toISOString().slice(0,10);let month=expenses.filter(e=>e.date.slice(0,7)===ym);let day=month.filter(e=>e.date.slice(0,10)===today);monthTotal.textContent=eur(month.reduce((s,e)=>s+e.amount,0));todayTotal.textContent=eur(day.reduce((s,e)=>s+e.amount,0));countToday.textContent=`${day.length} ${day.length===1?'despesa':'despeses'}`;renderHistory();renderStats()}
function renderHistory(){let list=document.getElementById('historyList');let arr=[...expenses].sort((a,b)=>b.date.localeCompare(a.date));if(!arr.length){list.innerHTML='<div class="empty">Encara no hi ha despeses.<br>Prem una icona per començar.</div>';return}list.innerHTML=arr.map(e=>{let c=CATS.find(x=>x.id===e.category)||CATS.at(-1),d=new Date(e.date);return `<div class="entry"><div class="entry-icon">${c.emoji}</div><div class="entry-main"><div class="entry-name">${c.name}</div><div class="entry-date">${d.toLocaleDateString('ca-ES')} · ${d.toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'})}${e.note?' · '+escapeHtml(e.note):''}</div></div><div class="entry-amount">${eur(e.amount)}</div><div class="entry-actions"><button class="mini" onclick="editExpense(${e.id})">✏️</button><button class="mini" onclick="deleteExpense(${e.id})">🗑️</button></div></div>`}).join('')}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function deleteExpense(id){if(!confirm('Eliminar aquesta despesa?'))return;expenses=expenses.filter(e=>e.id!==id);save();refresh()}
function editExpense(id){let e=expenses.find(x=>x.id===id);if(!e)return;selected=CATS.find(c=>c.id===e.category);openModal(selected.id);amount.value=String(e.amount).replace('.',',');note.value=e.note||'';document.querySelector('.key.ok').onclick=()=>{let v=parseFloat(amount.value.replace(',','.'));if(!v)return;Object.assign(e,{amount:Math.round(v*100)/100,note:note.value.trim()});save();document.querySelector('.key.ok').onclick=saveExpense;closeModal();refresh()}}
function clearAll(){if(!expenses.length)return;if(confirm('Vols eliminar totes les despeses d’aquest dispositiu?')){expenses=[];save();refresh()}}
function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));if(id==='stats')renderStats()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showScreen(b.dataset.screen));
function monthKey(d){return d.toISOString().slice(0,7)}
function renderStats(){let key=monthKey(viewDate),month=expenses.filter(e=>e.date.slice(0,7)===key),total=month.reduce((s,e)=>s+e.amount,0);monthLabel.textContent=viewDate.toLocaleDateString('ca-ES',{month:'long',year:'numeric'});statsTotal.textContent=eur(total);let sums=CATS.map(c=>({...c,total:month.filter(e=>e.category===c.id).reduce((s,e)=>s+e.amount,0)})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);let max=sums[0]?.total||1;categoryStats.innerHTML=sums.length?sums.map(c=>`<div class="catrow"><span style="font-size:23px">${c.emoji}</span><div class="bar"><i style="width:${c.total/max*100}%"></i></div><b>${eur(c.total)}</b></div>`).join(''):'<div class="empty">Cap despesa aquest mes.</div>'}
function changeMonth(n){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+n,1);renderStats()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.classList.add('show')});installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.classList.remove('show')};window.addEventListener('appinstalled',()=>installBtn.classList.remove('show'));
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});renderCats();refresh();
</script>
</body></html>
